<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <style>
    body {
      font: 13px system-ui, sans-serif;
      margin: 12px;
      min-width: 260px;
      background: #fff;
      color: #1f2937;
    }
    h3 { margin: 0 0 8px; color: #111827; }
    p { color: #6b7280; line-height: 1.45; }
    code { background: #f3f4f6; padding: 2px 4px; border-radius: 4px; font-size: 12px; }
    button {
      width: 100%;
      padding: 10px;
      margin-top: 8px;
      border: 0;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }
    .go { background: #7c3aed; color: #fff; }
    .stop { background: #f3f4f6; color: #374151; border: 1px solid #e5e7eb; }
  </style>
</head>
<body>
  <h3>BackLinkSourceBot</h3>
  <p>在 Backlinks 列表页使用右下角浅色调面板「开始」。</p>
  <button class="go" id="go">在本页开始（备用）</button>
  <button class="stop" id="stop">停止</button>
  <script src="popup.js"></script>
</body>
</html>
